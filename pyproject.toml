[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mztrain"
version = "0.1.0"
description = "Zero-memory, multi-core-CPU local AI training for ordinary laptops."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "License.txt" }
authors = [{ name = "Tokenoodle-Everything Organization" }]
keywords = [
    "deep-learning",
    "cpu",
    "low-memory",
    "machine-learning",
    "training",
    "framework",
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "psutil>=5.9 ; sys_platform != 'linux-musl'",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.1"]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/tokenoodle-everything/mztrain"
Documentation = "https://github.com/tokenoodle-everything/mztrain/blob/master/README.md"
Issues = "https://github.com/tokenoodle-everything/mztrain/issues"

[tool.setuptools]
packages = ["mztrain", "mztrain.core", "mztrain.data", "mztrain.models",
            "mztrain.optim", "mztrain.train", "mztrain.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"